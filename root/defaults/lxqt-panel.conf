panels=panel1

[panel1]
plugins=mainmenu,taskbar,statusnotifier,tray,volume,worldclock,showdesktop
position=Bottom
desktop=0

[mainmenu]
type=mainmenu
alignment=Left
ownIcon=true
icon=/usr/share/icons/hicolor/scalable/places/start-here-lxqt.svg
showText=true
text=Applications

[taskbar]
type=taskbar
alignment=Left
buttonWidth=200
closeOnMiddleClick=true
groupingEnabled=false

[statusnotifier]
type=statusnotifier
alignment=Right

[tray]
type=tray
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[worldclock]
type=worldclock
alignment=Right

[showdesktop]
type=showdesktop
alignment=Right
