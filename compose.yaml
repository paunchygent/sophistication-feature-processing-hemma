services:
  workshop:
    build:
      context: .
      target: runtime
    image: sophistication-feature-processing-hemma:2026-09-15
    container_name: gothenburg-lexicon-workshop
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    shm_size: 1gb
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Stockholm
      TITLE: Lexical Analysis Workshop
      SELKIES_FRAMERATE: "30"
      WORKSHOP_ENGINE: /opt/workshop/app/taaled/TAALED_1_4_1_Hemma.py
      WORKSHOP_PYTHON: /opt/taaled-venv/bin/python
    ports:
      - 127.0.0.1:13000:3000
      - 127.0.0.1:13001:3001
    volumes:
      - workshop-config:/config
      - workshop-workspace:/config/workspace
      - ${HEMMA_HOME_PATH:-/home/paunchygent}:/hemma-home:rw

volumes:
  workshop-config:
    name: gothenburg-lexicon-config
  workshop-workspace:
    name: gothenburg-lexicon-workspace
