services:
  workstation:
    build:
      context: .
      target: runtime
    image: sophistication-feature-processing-hemma:2026-09-15
    container_name: sophistication-feature-processing
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    shm_size: 1gb
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Stockholm
      TITLE: Sophistication Feature Processing
      SELKIES_FRAMERATE: "30"
      SELKIES_MANUAL_WIDTH: "1440"
      SELKIES_MANUAL_HEIGHT: "900"
      SELKIES_IS_MANUAL_RESOLUTION_MODE: "true"
      SELKIES_SCALING_DPI: "120"
      SELKIES_SECOND_SCREEN: "false"
      QT_SCALE_FACTOR: "1.25"
      WORKSHOP_ENGINE: /opt/workshop/app/taaled/TAALED_1_4_1_Hemma.py
      WORKSHOP_PYTHON: /opt/taaled-venv/bin/python
      FEATURE_BROWSE_ROOT: /hemma-home
    ports:
      - 127.0.0.1:13000:3000
      - 127.0.0.1:13001:3001
    volumes:
      - workshop-config:/config
      - workshop-workspace:/config/workspace
      - ${HEMMA_HOME_PATH:-/home/paunchygent}:/hemma-home:rw

volumes:
  workshop-config:
    name: gothenburg-lexicon-config
    external: true
  workshop-workspace:
    name: gothenburg-lexicon-workspace
    external: true
